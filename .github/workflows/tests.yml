name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --junitxml=pytest-results.xml
      - name: Annotate pytest failures
        if: failure() && hashFiles('pytest-results.xml') != ''
        run: python scripts/annotate_pytest_failures.py pytest-results.xml
      - run: ruff check exam_predictor tests app.py
