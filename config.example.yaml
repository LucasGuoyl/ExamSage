# ExamSage CLI configuration example.
# The recommended web app asks for these values in the browser and does not
# persist the API key. Never commit a real key.

llm:
  provider: openai             # openai | gemini | custom (experimental)
  api_key: YOUR_API_KEY_HERE
  approved_max_usd: 10.00
  # Most users should keep automatic routing. Optional overrides:
  # fast_model: gpt-5.6-luna
  # balanced_model: gpt-5.6-terra
  # reasoning_model: gpt-5.6
  # embedding_model: text-embedding-3-small
  # base_url: https://example.com/v1  # custom only
  temperature: 0.3
  max_tokens: 4096

embedding:
  backend: provider            # cloud-only; no local AI model
  batch_size: 96

chunking:
  chunk_size: 900
  chunk_overlap: 120

alignment:
  top_k_chunks_per_question: 5
  similarity_threshold: 0.52

scorer:
  enable_llm_scoring: true
  course_context: ""
  batch_size: 5
  max_chunks_to_score: 120
  min_chunk_chars: 50
  min_pedagogy_score: 0.28

fusion:
  low_data_threshold: 10
  weights:
    exam_frequency: 0.35
    explicit_emphasis: 0.10
    chunk_size: 0.05
    tutorial_overlap: 0.15
    syllabus_emphasis: 0.10
    llm_pedagogy_score: 0.15
    structural_signals: 0.10
  sparse_weights:
    exam_frequency: 0.10
    explicit_emphasis: 0.08
    chunk_size: 0.03
    tutorial_overlap: 0.10
    syllabus_emphasis: 0.14
    llm_pedagogy_score: 0.45
    structural_signals: 0.10
  emphasis_keywords:
    zh: ["重点", "考点", "考试", "必考", "重要", "记住", "经典", "高频"]
    en: ["important", "remember", "exam", "key", "essential", "frequently asked"]
  syllabus_verb_weights:
    derive: 1.0
    prove: 1.0
    compute: 0.8
    apply: 0.8
    explain: 0.6
    describe: 0.4
    aware: 0.2

generation:
  all_knowledge_points: true
  few_shot_examples: 3
  question_batch_size: 3
  summarise_batch_size: 4
  report_language: auto       # auto | en | zh

research:
  max_queries: 6
